<!doctype html>
<!-- 파일명: index.html | @version 1.1.0 -->
<!-- v1.1.0 장난 막기 — 심판 화면은 코트 열쇠(&k=)가 든 QR 로만, 한 경기는 처음 누른 기기 하나만 심판, 선생님이 받았는지(✓ 받음) 표시·못 받았으면 다시 보내기,
     관람 폴링은 폰 8초·TV 4초 + 흩기, 끊기면 점점 길게 쉬었다 다시 -->
<!-- v1.0.0 짝순환경기 관람·심판 화면 — 구글 밖(GitHub Pages)에 두어 학생 구글 계정(만 13세 미만 차단)과 상관없이 열린다.
     데이터는 «짝순환 중계소»(GAS) 에서 읽고 쓴다. 학생 정보는 이 저장소에 없다.
     ?r=방코드        → 관람 화면 (TV·폰)
     ?r=방코드&c=코트&k=열쇠 → 그 코트의 심판 화면 (선생님 화면의 심판 QR)
     (없음)           → 방 코드 입력 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>짝순환 중계</title>
<style>
:root{--primary:#0066cc;--primary-l:#eaf2fb;--ok:#1d8a4c;--ok-l:#eef8f1;--warn:#b25e00;--warn-l:#fff4e5;--red:#d70015;
  --g50:#fafafc;--g100:#f3f4f6;--g200:#e0e2e6;--g400:#8a8d93;--g500:#6b6e74;--g900:#1d1d1f;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--g100);color:var(--g900);font-family:var(--font);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
/* 공통 머리 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:1px solid var(--g200)}
.top .cls{font-size:26px;font-weight:900;letter-spacing:-.5px}
.top .sub{font-size:14px;color:var(--g500);font-weight:700}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font-weight:800;color:var(--red);font-size:13px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px #ffd9dc}
.live.off{color:var(--g400)}.live.off i{background:var(--g400);box-shadow:0 0 0 4px var(--g200)}
.upd{font-size:12px;color:var(--g400);font-weight:600}
.msg{max-width:520px;margin:60px auto;padding:24px;background:#fff;border-radius:18px;text-align:center;font-size:16px;line-height:1.6;color:var(--g500);font-weight:600}
.msg b{color:var(--g900)}
/* 방 코드 입력 */
.join{max-width:420px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;gap:14px}
.join h1{margin:0;font-size:26px}
.join p{margin:0;color:var(--g500);font-weight:600}
.join input{font:900 34px var(--font);letter-spacing:8px;text-align:center;text-transform:uppercase;padding:14px;border-radius:16px;border:2px solid var(--g200);background:#fff;width:100%}
.join input:focus{outline:none;border-color:var(--primary)}
.btn{border:none;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:800}
.btn.p{background:var(--primary);color:#fff}.btn.g{background:#fff;color:var(--g900);border:1.5px solid var(--g200)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .btn{flex:1 1 30%;min-width:96px}
/* 관람 */
.vmain{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:14px 18px}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-content:start}
.court{background:#fff;border-radius:16px;padding:12px;border:2px solid transparent}
.court.on{border-color:var(--primary)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.ch b{font-size:17px}
.pill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.on{background:var(--primary-l);color:var(--primary)}.pill.done{background:var(--ok-l);color:var(--ok)}
.pill.wait{background:var(--g100);color:var(--g500)}.pill.sent{background:var(--warn-l);color:var(--warn)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:12px;background:var(--g50);margin-bottom:6px;border-left:6px solid transparent}
.row .n{font-size:18px;font-weight:800;min-width:0;line-height:1.3}
.row .n small{font-size:12px;color:var(--g400);font-weight:700;margin-right:4px}
.row .s{font-size:36px;font-weight:900;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.row.win{background:var(--ok-l)}.row.win .s{color:var(--ok)}
.tag{font-size:12px;font-weight:800;color:var(--ok);margin-left:6px}
.setl{font-size:12.5px;color:var(--g500);font-weight:700;margin:-2px 0 6px 4px}
.ref{font-size:12.5px;color:var(--g500);font-weight:600;margin-top:4px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:#fff;border-radius:16px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:15px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:5px 3px;text-align:center;font-size:14px}
th{color:var(--g500);font-size:12px;border-bottom:1px solid var(--g200)}
td.nm{text-align:left;font-weight:700}
.wl{display:flex;flex-wrap:wrap;gap:6px}
.wl span{background:var(--g100);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13.5px}
.empty{color:var(--g400);font-size:13px;font-weight:600}
@media (max-width:760px){.vmain{grid-template-columns:1fr}.top .cls{font-size:22px}}
/* 심판 */
.rwrap{max-width:460px;margin:0 auto;padding:12px 14px 28px;display:flex;flex-direction:column;gap:10px}
.rhd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rhd .c{font-size:26px;font-weight:900}
.rhd .m{font-size:13px;color:var(--g500);font-weight:700;text-align:right;line-height:1.35}
.who{background:#fff;border-radius:14px;padding:9px 14px;font-size:14px;font-weight:700;color:var(--g500)}
.who b{color:var(--g900)}
.sets{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sets button{font-size:14px;font-weight:800;padding:7px 14px;border-radius:999px;background:#fff;color:var(--g500);border:1.5px solid var(--g200)}
.sets button.on{background:var(--g900);color:#fff;border-color:var(--g900)}
.sets small{font-weight:700;opacity:.75;margin-left:4px}
.tp{background:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:8px solid transparent}
.tp .nm{font-size:19px;font-weight:900;line-height:1.35}
.tp .nm small{font-size:13px;color:var(--g400);margin-right:5px}
.ctl{display:flex;align-items:center;gap:10px}
.ctl button{height:62px;border-radius:16px;border:none;font-size:28px;font-weight:900}
.ctl .mi{width:62px;background:var(--g100);color:var(--g500)}
.ctl .pl{flex:1;background:var(--primary);color:#fff}
.ctl .sc{font-size:52px;font-weight:900;min-width:80px;text-align:center;font-variant-numeric:tabular-nums}
.vs{text-align:center;font-weight:800;color:var(--g400);font-size:13px}
.end{height:58px;border-radius:16px;border:none;background:var(--ok);color:#fff;font-size:19px;font-weight:900}
.end:disabled{opacity:.45}
.note{font-size:13px;color:var(--g500);text-align:center;font-weight:600;line-height:1.5}
.ask{background:#fff;border:2px solid var(--ok);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:center;font-weight:700}
.ask .b2{display:flex;gap:8px}.ask .b2 .btn{flex:1}
.state{border-radius:14px;padding:12px 14px;font-weight:800;text-align:center}
.state.sent{background:var(--warn-l);color:var(--warn)}.state.saved{background:var(--ok-l);color:var(--ok)}
.next{background:#fff;border-radius:14px;padding:10px 14px;font-size:14px;color:var(--g500);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g900);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const RELAY = 'https://script.google.com/macros/s/AKfycbzNmsoYBaP0aGALUq2X96ULc70G5U4CE1c-vTGfTHDS9VqAfV9wlhpE_H2WhBN5JKob/exec';
const Q = new URLSearchParams(location.search);
const ROOM = String(Q.get('r') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const COURT = Q.get('c');
const KEY = String(Q.get('k') || '').slice(0, 40);
const DEV = (()=>{ let d = ''; try { d = localStorage.getItem('jjdev') || ''; } catch(e){} if (d.length < 8){ d = 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36); try { localStorage.setItem('jjdev', d); } catch(e){} } return d; })();
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastT = 0;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

async function view(){
  const r = await fetch(RELAY + '?a=view&r=' + encodeURIComponent(ROOM), { cache: 'no-store' });
  return r.json();
}
async function post(o){
  const r = await fetch(RELAY, { method: 'POST', body: JSON.stringify(Object.assign({ r: ROOM }, o)) });   // text/plain → 사전 확인 없이 보낸다
  return r.json();
}
const clsLabel = c => { const m = String(c || '').match(/^(\d+)-(\d+)$/); return m ? m[1] + '학년 ' + m[2] + '반' : String(c || ''); };
const pname = p => p ? '<small>' + esc(p.s || '') + '</small>' + esc(p.n || '') : '<span class="empty">(빈자리)</span>';
const tnames = arr => (arr || []).filter(Boolean).map(pname).join(' · ') || '<span class="empty">-</span>';
const sumSets = sets => { const o = { wa: 0, wb: 0, played: 0 }; (sets || []).forEach(p => { const a = +p[0] || 0, b = +p[1] || 0; if (a + b <= 0) return; o.played++; if (a > b) o.wa++; else if (b > a) o.wb++; }); return o; };
function scoreOf(c, live){
  const L = live && live[c.mid];
  if (c.st !== 'saved' && L) return { sc: L.sc || [0, 0, 0], sets: L.sets || null, done: !!L.done, live: true };
  return { sc: c.sc || [0, 0, 0], sets: c.sets || null, done: c.st === 'saved', live: false };
}
function since(t, now){ const s = Math.max(0, Math.round(((now || Date.now()) - t) / 1000)); return s < 60 ? s + '초 전' : Math.round(s / 60) + '분 전'; }
function head(st, data, extra){
  const fresh = data && (data.now - data.t) < 10 * 60 * 1000;
  return '<div class="top"><span class="cls">' + esc(clsLabel(st.cls)) + '</span><span class="sub">' + esc([st.title, st.when, st.round].filter(Boolean).join(' · ')) + (extra || '') + '</span>' +
    '<span class="live' + (fresh ? '' : ' off') + '"><i></i>' + (fresh ? '실시간' : '선생님 화면 대기') + '</span><span class="upd">' + (data ? since(data.t, data.now) + ' 갱신' : '') + '</span></div>';
}

/* ───────── 방 코드 입력 ───────── */
function joinScreen(){
  app.innerHTML = '<div class="join"><h1>짝순환 중계</h1><p>선생님이 알려 준 방 코드를 넣으세요</p>' +
    '<input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" inputmode="text" aria-label="방 코드" placeholder="ABCDE">' +
    '<button class="btn p" id="goV">👀 관람하기</button><p style="font-size:14px">심판은 선생님 화면의 <b>코트별 심판 QR</b>을 찍어서 들어옵니다</p></div>';
  const inp = document.getElementById('code');
  const code = () => inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('goV').click(); });
  document.getElementById('goV').onclick = () => { if (code().length >= 4) location.search = '?r=' + code(); else toast('방 코드를 확인하세요'); };
}

/* ───────── 관람 ───────── */
function courtCard(c, live){
  const S = scoreOf(c, live);
  const kin = (c.t || []).length >= 3;
  const useSets = !kin && (c.rows || 1) >= 2;
  const big = useSets ? (() => { const t = sumSets(S.sets); return [t.wa, t.wb]; })() : S.sc;
  const nT = kin ? 3 : 2;
  let win = -1;
  if (S.done){
    const vals = big.slice(0, nT);
    const mx = Math.max.apply(null, vals);
    if (vals.filter(v => v === mx).length === 1 && mx > 0) win = vals.indexOf(mx);
  }
  const pill = c.st === 'saved' ? '<span class="pill done">경기 끝</span>' : (S.done ? '<span class="pill sent">점수 확인 중</span>' : ((c.st === 'live' || S.live) ? '<span class="pill on">경기 중</span>' : '<span class="pill wait">대기</span>'));
  let rows = '';
  for (let i = 0; i < nT; i++){
    const col = (c.colors || [])[i];
    rows += '<div class="row' + (win === i ? ' win' : '') + '"' + (col ? ' style="border-left-color:' + esc(col) + '"' : '') + '><span class="n">' +
      ((c.tn || [])[i] ? '<small>' + esc(c.tn[i]) + '</small><br>' : '') + tnames((c.t || [])[i]) + (win === i ? '<span class="tag">승</span>' : '') +
      '</span><span class="s">' + (+big[i] || 0) + '</span></div>';
  }
  const setLine = useSets && S.sets ? '<div class="setl">' + S.sets.filter(p => (+p[0] || 0) + (+p[1] || 0) > 0).map((p, k) => (k + 1) + '세트 ' + p[0] + '-' + p[1]).join(' · ') + '</div>' : '';
  const refs = [c.ref ? '주심 ' + (c.ref.s || '') + ' ' + c.ref.n : '', (c.ls || []).filter(Boolean).length ? '선심 ' + c.ls.filter(Boolean).map(p => (p.s || '') + ' ' + p.n).join(', ') : ''].filter(Boolean).join(' · ');
  return '<div class="court' + ((c.st === 'live' || S.live) && c.st !== 'saved' ? ' on' : '') + '"><div class="ch"><b>' + esc(c.name) + '코트' + (c.label ? ' · ' + esc(c.label) : '') + '</b>' + pill + '</div>' +
    rows + setLine + (refs ? '<div class="ref">' + esc(refs) + '</div>' : '') + '</div>';
}
function renderViewer(data){
  const st = data.st || {}, live = data.live || {};
  const courts = (st.courts || []).map(c => courtCard(c, live)).join('') || '<div class="msg">아직 배정된 경기가 없습니다</div>';
  const tb = (st.table || []).slice(0, 12);
  const table = tb.length ? '<table><tr><th>#</th><th style="text-align:left">선수</th><th>승</th><th>무</th><th>패</th><th>득실</th></tr>' +
    tb.map((r, i) => '<tr><td>' + (i + 1) + '</td><td class="nm">' + esc(r.n) + '</td><td>' + r.w + '</td><td>' + r.d + '</td><td>' + r.l + '</td><td>' + (r.g > 0 ? '+' : '') + r.g + '</td></tr>').join('') + '</table>'
    : '<div class="empty">저장된 경기가 생기면 여기에 쌓입니다</div>';
  const wait = (st.wait || []).length ? '<div class="wl">' + st.wait.map(p => '<span>' + esc((p.s || '') + ' ' + p.n) + '</span>').join('') + '</div>' : '<div class="empty">없음</div>';
  app.innerHTML = head(st, data) + '<div class="vmain"><div class="courts">' + courts + '</div><div class="side">' +
    '<div class="card"><h3>전적</h3>' + table + '</div><div class="card"><h3>대기 (' + (st.wait || []).length + '명)</h3>' + wait + '</div></div></div>';
}

/* ───────── 심판 ───────── */
let R = { mid: '', sc: [0, 0, 0], sets: null, cur: 0, asking: false, sent: false, sentAt: 0, blocked: '' };
let liveT = 0;
function refLoad(c, live){
  if (R.mid === c.mid) return;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('jjref_' + ROOM + '_' + c.mid) || 'null'); } catch(e){}
  const L = live && live[c.mid];
  const src = saved || L || { sc: c.sc, sets: c.sets };
  const rows = Math.max(1, c.rows || 1);
  R = { mid: c.mid, sc: (src.sc || [0, 0, 0]).slice(0, 3), sets: rows >= 2 ? (src.sets && src.sets.length ? src.sets.map(p => p.slice(0, 2)) : []) : null, cur: 0, asking: false, sent: !!(L && L.done), sentAt: (L && L.done) ? Date.now() : 0, blocked: '' };
  if (R.sets){ while (R.sets.length < rows) R.sets.push([0, 0]); let k = 0; R.sets.forEach((p, i) => { if ((+p[0] || 0) + (+p[1] || 0) > 0) k = i; }); R.cur = k; }
  while (R.sc.length < 3) R.sc.push(0);
}
function refStore(){ try { localStorage.setItem('jjref_' + ROOM + '_' + R.mid, JSON.stringify({ sc: R.sc, sets: R.sets })); } catch(e){} }
function refPayload(){
  if (R.sets){ const t = R.sets.reduce((o, p) => [o[0] + (+p[0] || 0), o[1] + (+p[1] || 0)], [0, 0]); return { sc: [t[0], t[1], 0], sets: R.sets }; }
  return { sc: R.sc, sets: null };
}
function refBump(i, d){
  if (R.sets){ const p = R.sets[R.cur]; p[i] = Math.max(0, (+p[i] || 0) + d); }
  else R.sc[i] = Math.max(0, (+R.sc[i] || 0) + d);
  R.sent = false; refStore(); refPaint();
  clearTimeout(liveT);
  liveT = setTimeout(() => { const p = refPayload(); post({ a: 'live', mid: R.mid, k: KEY, dev: DEV, sc: p.sc, sets: p.sets }).then(refErr).catch(() => {}); }, 700);
}
// 중계소가 거절한 이유 → 화면에 남긴다
function refErr(r){
  if (!r || r.ok) return r;
  if (r.err === 'claimed' || r.err === 'auth'){ R.blocked = r.err; R.asking = false; refPaint(); }
  return r;
}
async function refSend(){
  const p = refPayload();
  try{
    const r = refErr(await post({ a: 'score', mid: R.mid, k: KEY, dev: DEV, sc: p.sc, sets: p.sets }));
    if (r.ok){ R.sent = true; R.sentAt = Date.now(); R.asking = false; toast('✅ 점수를 보냈습니다'); }
    else if (r.err === 'old') toast('선생님 화면의 경기가 바뀌었습니다 — 새 경기를 확인하세요');
    else if (r.err === 'busy') toast('사람이 몰려 늦어지고 있습니다 — 다시 눌러 주세요');
    else if (r.err !== 'claimed' && r.err !== 'auth') toast('보내지 못했습니다 (' + r.err + ')');
  }catch(e){ toast('연결하지 못했습니다 — 다시 눌러 주세요'); }
  refPaint();
}
let lastData = null;
function refPaint(){
  const data = lastData; if (!data) return;
  const st = data.st || {};
  const c = (st.courts || []).find(x => String(x.name) === String(COURT));
  const nx = (st.next || {})[COURT];
  const nextHtml = nx ? '<div class="next">다음 경기: ' + (nx.t || []).map(t => (t || []).filter(Boolean).map(p => (p.s || '') + ' ' + p.n).join('·')).map(esc).join(' vs ') + '</div>' : '';
  if (!c){
    app.innerHTML = head(st, data) + '<div class="rwrap"><div class="rhd"><span class="c">' + esc(COURT) + '코트 심판</span></div><div class="msg">지금 이 코트에는 경기가 없습니다.<br>선생님이 다음 라운드를 열면 자동으로 바뀝니다.</div>' + nextHtml + '</div>';
    return;
  }
  refLoad(c, data.live);
  if (!KEY || R.blocked){
    const why = !KEY ? '심판 화면은 선생님 화면의 <b>코트별 심판 QR</b>로만 열 수 있습니다.'
      : R.blocked === 'claimed' ? '<b>다른 기기가 이 경기 심판을 하고 있습니다.</b><br>심판을 바꾸려면 선생님께 «심판 풀기»를 부탁하세요.'
      : '<b>심판 QR이 바뀌었습니다.</b><br>선생님 화면의 새 심판 QR을 다시 찍어 주세요.';
    app.innerHTML = head(st, data) + '<div class="rwrap"><div class="rhd"><span class="c">' + esc(c.name) + '코트 심판</span></div><div class="msg" style="margin:20px 0">' + why + '</div>' +
      (R.blocked === 'claimed' ? '<button class="btn g" id="retry">다시 확인</button>' : '') + '</div>';
    const rt = document.getElementById('retry'); if (rt) rt.onclick = () => { R.blocked = ''; refPaint(); };
    return;
  }
  const kin = (c.t || []).length >= 3, nT = kin ? 3 : 2;
  const saved = c.st === 'saved';
  const got = !!(data.rx && data.rx[c.mid]);
  const vals = saved ? (R.sets ? ((c.sets || [])[R.cur] || [0, 0]) : (c.sc || [0, 0, 0])) : (R.sets ? R.sets[R.cur] : R.sc);   // 저장된 경기는 선생님 점수
  let h = '<div class="rwrap"><div class="rhd"><span class="c">' + esc(c.name) + '코트 심판</span><span class="m">' + esc(clsLabel(st.cls)) + (st.when ? ' · ' + esc(st.when) : '') + '<br>' + esc([st.round, c.label].filter(Boolean).join(' · ')) + '</span></div>';
  const refs = [c.ref ? '주심 <b>' + esc((c.ref.s || '') + ' ' + c.ref.n) + '</b>' : '', (c.ls || []).filter(Boolean).length ? '선심 <b>' + esc(c.ls.filter(Boolean).map(p => (p.s || '') + ' ' + p.n).join(', ')) + '</b>' : ''].filter(Boolean).join(' · ');
  if (refs) h += '<div class="who">' + refs + '</div>';
  if (R.sets){
    h += '<div class="sets">' + R.sets.map((p, k) => '<button class="' + (k === R.cur ? 'on' : '') + '" data-set="' + k + '">' + (k + 1) + '세트' + ((+p[0] || 0) + (+p[1] || 0) > 0 ? '<small>' + p[0] + ':' + p[1] + '</small>' : '') + '</button>').join('') + '</div>';
  }
  for (let i = 0; i < nT; i++){
    const col = (c.colors || [])[i];
    h += (i > 0 && !kin ? '<div class="vs">VS</div>' : '') +
      '<div class="tp"' + (col ? ' style="border-left-color:' + esc(col) + '"' : '') + '><div class="nm">' + ((c.tn || [])[i] ? '<small>' + esc(c.tn[i]) + '</small><br>' : '') + tnames((c.t || [])[i]) + '</div>' +
      '<div class="ctl"><button class="mi" data-i="' + i + '" data-d="-1" aria-label="1점 빼기"' + (saved ? ' disabled' : '') + '>−</button><span class="sc">' + (+vals[i] || 0) + '</span>' +
      '<button class="pl" data-i="' + i + '" data-d="1" aria-label="1점 더하기"' + (saved ? ' disabled' : '') + '>+1</button></div></div>';
  }
  if (saved) h += '<div class="state saved">✓ 선생님이 이 경기 점수를 저장했습니다</div>';
  else if (R.asking){
    const p = refPayload();
    const txt = R.sets ? R.sets.filter(x => (+x[0] || 0) + (+x[1] || 0) > 0).map((x, k) => (k + 1) + '세트 ' + x[0] + ':' + x[1]).join(', ') : p.sc.slice(0, nT).join(' : ');
    h += '<div class="ask">이 점수로 보낼까요?<br><span style="font-size:20px">' + esc(txt || '0 : 0') + '</span><div class="b2"><button class="btn g" id="askNo">취소</button><button class="btn p" id="askYes">보내기</button></div></div>';
  } else {
    const late = R.sent && !got && R.sentAt && (Date.now() - R.sentAt > 20000);
    h += '<button class="end" id="endBtn">' + (late ? '다시 보내기' : (R.sent ? '다시 보내기 (고친 점수)' : '경기 끝 · 점수 보내기')) + '</button>';
    if (R.sent && got) h += '<div class="state saved">✓ 선생님 화면에 들어갔습니다 — 선생님이 저장하면 끝</div>';
    else if (late) h += '<div class="state sent">⚠️ 아직 선생님 화면에 안 들어갔습니다 — «다시 보내기»를 눌러 주세요</div>';
    else if (R.sent) h += '<div class="state sent">보냈습니다 — 선생님 화면에 들어가는 중…</div>';
    else h += '<div class="note">점수는 누를 때마다 관람 화면에 바로 보입니다<br>보낸 점수는 선생님이 확인한 뒤 저장됩니다</div>';
  }
  h += nextHtml + '</div>';
  app.innerHTML = head(st, data) + h;
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => refBump(+b.dataset.i, +b.dataset.d));
  app.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { R.cur = +b.dataset.set; refPaint(); });
  const eb = document.getElementById('endBtn'); if (eb) eb.onclick = () => { R.asking = true; refPaint(); };
  const ay = document.getElementById('askYes'); if (ay) ay.onclick = refSend;
  const an = document.getElementById('askNo'); if (an) an.onclick = () => { R.asking = false; refPaint(); };
}

/* ───────── 시작 ───────── */
let failN = 0;
async function tick(){
  try{
    const d = await view();
    failN = 0;
    if (!d.ok){
      app.innerHTML = '<div class="msg">' + (d.err === 'none' ? '<b>' + esc(ROOM) + '</b> 방의 중계가 아직 열리지 않았거나 끝났습니다.<br>선생님이 «중계 켜기»를 누르면 자동으로 열립니다.' : '방 코드를 확인하세요') + '</div>';
    } else if (COURT != null){
      lastData = d;
      if (!R.asking) refPaint();
    } else renderViewer(d);
  }catch(e){
    if (++failN >= 2) toast('연결이 잠시 끊겼습니다 — 다시 시도 중');
    if (failN > 4) failN = 4;
  }
}
// 폰 관람은 8초, 큰 화면(TV)은 4초, 심판은 4초 — 조금씩 흩어서 한꺼번에 몰리지 않게, 끊기면 점점 길게 쉰다
function period(){ return COURT != null ? 4000 : (window.innerWidth >= 900 ? 4000 : 8000); }
async function loop(){
  await tick();
  const back = failN ? Math.min(30000, period() * Math.pow(2, failN)) : period();
  setTimeout(loop, back * (0.85 + Math.random() * 0.3));
}
if (!ROOM) joinScreen();
else setTimeout(loop, Math.random() * 800);
</script>
